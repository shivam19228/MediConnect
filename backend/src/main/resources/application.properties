# ========================================================
# MediConnect Backend - Core Application Configuration
# ========================================================
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=mediconnect-backend
server.port=${SERVER_PORT:8081}

# ========================================================
# MySQL Database Configuration
# Sensitive credentials are read from environment variables
# ========================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mediconnect_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# Spring Data JPA / Hibernate
# Schema is governed by Flyway migrations; Hibernate validates entities against schema
# ========================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================================================
# Database Migration: Flyway
# ========================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ========================================================
# JWT Authentication Configuration
# ========================================================
mediconnect.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
mediconnect.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ========================================================
# MediConnect Security & CORS Configuration
# ========================================================
mediconnect.cors.allowed-origins=${CLIENT_URL:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}

# ========================================================
# Google Gemini AI Integration Configuration
# Key is injected via GEMINI_API_KEY environment variable
# ========================================================
mediconnect.gemini.api-key=${GEMINI_API_KEY:}
mediconnect.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
mediconnect.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
mediconnect.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}

# ========================================================
# Local Medical Document Storage Configuration
# Configurable storage directory outside frontend public/static folder
# ========================================================
mediconnect.storage.local-dir=${MEDICAL_UPLOAD_DIR:uploads/medical-reports}
mediconnect.storage.max-file-size-bytes=${STORAGE_MAX_FILE_SIZE_BYTES:15728640}

# Multipart upload limits (15 MB maximum)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ========================================================
# Actuator Configuration
# Expose only health and info endpoints over web
# ========================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.diskspace.enabled=false
