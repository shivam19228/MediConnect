# ========================================================
# MediConnect Backend - Test Configuration (Isolated H2 In-Memory)
# ========================================================
spring.application.name=mediconnect-backend-test

# In-memory H2 database running in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:mediconnect_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate schema creation for isolated tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Disable Flyway during unit/slice test execution
spring.flyway.enabled=false

# Test JWT Configuration
mediconnect.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
mediconnect.jwt.expiration-ms=86400000

mediconnect.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000

# Gemini AI Test Configuration (Mocked / Non-live)
mediconnect.gemini.api-key=test-gemini-key
mediconnect.gemini.model=gemini-3.5-flash
mediconnect.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
mediconnect.gemini.timeout-seconds=5

# Local Storage Test Configuration
mediconnect.storage.local-dir=target/test-uploads/medical-reports
mediconnect.storage.max-file-size-bytes=15728640

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.diskspace.enabled=false
